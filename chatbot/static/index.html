<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catholic Near Me – Tìm nhà thờ Công giáo gần bạn</title>
  <meta name="description" content="Tìm nhà thờ Công giáo gần bạn trên bản đồ, xem giờ lễ và hỏi đáp với trợ lý.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M10 2h4v6h6v4h-6v10h-4V12H4V8h6z' fill='%237A5410'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Catholic Near Me, tải lại trang">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v6h6v4h-6v10h-4V12H4V8h6z"/></svg>
      <span class="brand-text">
        <span class="brand-name">Catholic Near Me</span>
        <span class="brand-sub">Tìm nhà thờ Công giáo gần bạn</span>
      </span>
    </a>

    <div class="toolbar">
      <button id="locate-btn" class="btn btn-primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
        <span>Tìm nhà thờ gần tôi</span>
      </button>

      <form id="search-form" class="search" role="search" autocomplete="off">
        <label for="search-input" class="sr-only">Địa chỉ</label>
        <input id="search-input" type="search" maxlength="200"
               placeholder="Hoặc nhập địa chỉ, ví dụ: Chợ Bến Thành">
        <button class="btn btn-secondary" type="submit">Tìm</button>
        <ul id="search-results" class="search-results" hidden></ul>
      </form>
    </div>
  </header>

  <main class="layout">
    <aside class="panel" aria-label="Kết quả tìm kiếm">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="church-list" class="church-list"></ol>
    </aside>

    <div class="map-wrap">
      <div id="map" class="map" role="region" aria-label="Bản đồ nhà thờ"></div>
      <div class="legend" aria-label="Chú thích">
        <span><i class="legend-user"></i>Vị trí của bạn</span>
        <span><i class="legend-pin"></i>Nhà thờ</span>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
