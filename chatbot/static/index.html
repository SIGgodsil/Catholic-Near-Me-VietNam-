<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catholic Near Me – Tìm nhà thờ Công giáo gần bạn</title>
  <meta name="description" content="Tìm nhà thờ Công giáo gần bạn trên bản đồ, xem giờ lễ và hỏi đáp với trợ lý.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M10 2h4v6h6v4h-6v10h-4V12H4V8h6z' fill='%237A5410'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Catholic Near Me, tải lại trang">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v6h6v4h-6v10h-4V12H4V8h6z"/></svg>
      <span class="brand-text">
        <span class="brand-name">Catholic Near Me</span>
        <span class="brand-sub">Tìm nhà thờ Công giáo gần bạn</span>
      </span>
    </a>

    <div class="toolbar">
      <button id="locate-btn" class="btn btn-primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
        <span>Tìm nhà thờ gần tôi</span>
      </button>

      <form id="search-form" class="search" role="search" autocomplete="off">
        <label for="search-input" class="sr-only">Địa chỉ</label>
        <input id="search-input" type="search" maxlength="200"
               placeholder="Hoặc nhập địa chỉ, ví dụ: Chợ Bến Thành">
        <button class="btn btn-secondary" type="submit">Tìm</button>
        <ul id="search-results" class="search-results" hidden></ul>
      </form>
    </div>
  </header>

  <main class="layout">
    <aside class="panel" aria-label="Kết quả tìm kiếm">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="church-list" class="church-list"></ol>
    </aside>

    <div class="map-wrap">
      <div id="map" class="map" role="region" aria-label="Bản đồ nhà thờ"></div>
      <div class="legend" aria-label="Chú thích">
        <span><i class="legend-user"></i>Vị trí của bạn</span>
        <span><i class="legend-pin"></i>Nhà thờ</span>
        <span><i class="legend-upcoming"></i>Có lễ trong 2 giờ tới</span>
      </div>
    </div>
  </main>

  <!-- Chatbot: nút nổi + cửa sổ chat -->
  <button id="chat-fab" class="chat-fab" type="button" aria-controls="chat-panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm3 6v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg>
    <span>Hỏi giờ lễ</span>
  </button>

  <section id="chat-panel" class="chat-panel" aria-label="Trợ lý giờ lễ" hidden>
    <header class="chat-header">
      <div class="chat-title">
        <span class="chat-title-main">Trợ lý giờ lễ</span>
        <span id="chat-subtitle" class="chat-title-sub">Trả lời dựa trên dữ liệu 80 nhà thờ</span>
      </div>
      <button id="chat-reset" class="chat-icon-btn" type="button" title="Bắt đầu hội thoại mới" aria-label="Bắt đầu hội thoại mới">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button id="chat-minimize" class="chat-icon-btn" type="button" title="Thu nhỏ" aria-label="Thu nhỏ cửa sổ chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z"/></svg>
      </button>
      <button id="chat-close" class="chat-icon-btn" type="button" title="Đóng" aria-label="Đóng cửa sổ chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </header>
    <div class="chat-body">
      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="sr-only">Câu hỏi</label>
        <textarea id="chat-input" rows="1" maxlength="500" placeholder="Hỏi về giờ lễ, nhà thờ…"></textarea>
        <button id="chat-send" class="btn btn-primary chat-send" type="submit" aria-label="Gửi câu hỏi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
        </button>
      </form>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
