# Cấu hình để deploy lên Vercel. Chạy trên máy vẫn dùng requirements.txt như trong README.
[project]
name = "catholic-near-me"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Chỉ gói cần lúc chạy web. pytest nằm trong requirements.txt cho máy dev.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "tzdata==2026.5",
    "rapidfuzz==3.14.6",
    "ollama==0.6.3",
]

[tool.vercel]
# App FastAPI nằm ở server/main.py, không thuộc vị trí Vercel tự dò.
entrypoint = "server.main:app"

[tool.vercel.scripts]
# data/churches.db không có trong Git (.gitignore), nên tạo lại từ CSV lúc build.
build = "python scripts/build_db.py"
